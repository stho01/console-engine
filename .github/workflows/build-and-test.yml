name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: >
        dotnet test --no-build --verbosity normal
        --settings coverage.runsettings --collect:"XPlat Code Coverage"
        --results-directory TestResults
    - name: Coverage report
      if: ${{ !cancelled() }}
      run: |
        dotnet tool restore
        dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage `
          -reporttypes:"Html;MarkdownSummaryGithub"
        Get-Content coverage/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY
    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
